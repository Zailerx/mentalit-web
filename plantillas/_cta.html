{% if inline %}
<aside class="cta-inline" aria-label="Mentalit">
  <img src="../../img/icon-96.webp" width="56" height="56" alt="">
  <div>
    <p class="cta-title">{{ cta.titulo }}</p>
    <p>{{ cta.texto }}</p>
    <a class="btn" href="{{ c.app_store_url }}" data-cta="articulo">{{ cta.boton }}</a>
  </div>
</aside>
{% else %}
<section class="cta-end" aria-labelledby="cta-final">
  <div class="wrap cta-end-inner">
    <img src="{{ u('img/train.webp') }}" width="406" height="720" alt="" loading="lazy">
    <div>
      <h2 id="cta-final">{{ cta.titulo }}</h2>
      <p>{{ cta.texto }}</p>
      <a class="btn btn-light" href="{{ c.app_store_url }}" data-cta="final">{{ cta.boton }}</a>
    </div>
  </div>
</section>
{% endif %}
